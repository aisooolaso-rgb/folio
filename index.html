rap}.stat .count{font-size:29px;font-weight:600;line-height:1.4}.done{color:#236a46}.latest{color:#ba760f}.reading{color:#245e9f}.unread{color:#6c6259}.list{display:grid;gap:10px}.book{background:var(--card);border-radius:18px;display:flex;gap:13px;padding:10px;min-height:118px;box-shadow:0 4px 14px #6c52360b}.cover{width:76px;min-width:76px;height:101px;border-radius:8px;object-fit:cover;background:#e8ddcc;box-shadow:0 1px 3px #0001}.cover.placeholder{display:grid;place-items:center;text-align:center;padding:6px;font-family:Georgia,serif;color:#867662;font-size:12px;overflow-wrap:anywhere}.bookbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}.booktop{display:flex;align-items:flex-start;gap:4px}.bookname{font-size:15px;font-weight:700;line-height:1.5;flex:1;overflow-wrap:anywhere;padding-top:2px}.more{border:0;background:transparent;color:#9d9285;font-size:22px;line-height:1;padding:0 4px}.bookbottom{display:flex;justify-content:space-between;align-items:end;gap:4px;flex-wrap:wrap}.pill{border:0;border-radius:30px;padding:7px 11px;font-size:11px;font-weight:700;white-space:nowrap;color:#333}.pill.done{background:var(--green);color:#275d3a}.pill.latest{background:var(--yellow);color:#7d4d00}.pill.reading{background:var(--blue);color:#23517f}.pill.unread{background:var(--gray);color:#625c55}.counter{display:flex;align-items:center;gap:8px;margin-left:auto}.round{width:35px;height:35px;border-radius:50%;border:0;background:#f0ebe3;color:var(--ink);font-size:25px;line-height:1}.round.plus{background:var(--ink);color:white}.num{border:0;background:none;color:#271f19;min-width:34px;font-size:17px;font-weight:600;text-align:center;padding:3px 0}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fffcf7ee;backdrop-filter:blur(14px);border-top:1px solid #e8ded1;display:flex;justify-content:space-around;padding:9px max(12px,calc((100vw - 560px)/2)) calc(9px + env(safe-area-inset-bottom));z-index:5}.navitem{border:0;background:none;color:#958b80;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px;font-size:11px;font-weight:600}.navitem.selected{color:#49321d}.navitem svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}.navitem .addcircle{width:40px;height:40px;background:var(--ink);color:white;border-radius:50%;display:grid;place-items:center;margin-top:-12px}.navitem .addcircle svg{width:24px}.screen{display:none}.screen.active{display:block}.sectiontitle{font-family:'DM Serif Display',Georgia,serif;font-size:25px;margin:8px 0 17px}.panel{background:var(--card);padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 4px 14px #6c52360b}.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:600;font-size:12px}.field input,.field select{border:1px solid var(--line);border-radius:11px;padding:12px;background:white;width:100%;color:var(--ink)}.primary{width:100%;background:var(--ink);color:white;border:0;border-radius:24px;padding:14px;font-weight:700;margin-top:12px}.secondary{background:#eee6db;color:var(--ink);border:0;border-radius:11px;padding:10px 12px}.small{font-size:12px;color:var(--muted);line-height:1.7}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.coverchoices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.choice{border:2px solid transparent;border-radius:9px;padding:3px;background:#f5eee4;min-width:0}.choice.selected{border-color:#6e4f32}.choice img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:5px}.choice span{font-size:10px;display:block;text-align:center}.empty{text-align:center;color:var(--muted);padding:45px 10px}.chartbar{height:14px;border-radius:20px;overflow:hidden;display:flex;background:#eee}.chartbar span{height:100%}.settingsrow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:13px 0;gap:12px}.settingsrow:last-child{border:0}.settingsrow select{max-width:160px;border:1px solid var(--line);border-radius:8px;background:white;padding:8px}.overlay{position:fixed;inset:0;background:#21190f77;z-index:20;display:flex;align-items:end;justify-content:center}.sheet{background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:90dvh;overflow:auto}.sheet h2{margin:0 0 12px;font-size:20px}.statusgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.statusgrid button{border:1px solid #d8cdbf;border-radius:12px;padding:12px;background:var(--card)}.danger{color:#a63b34}.toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#44362b;color:white;border-radius:24px;padding:10px 20px;z-index:40;white-space:nowrap;font-size:12px}@media(min-width:600px){.bottomnav{max-width:560px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}}
</style></head><body><div class="app"><section id="home" class="screen active"><header><div class="brand"><svg viewBox="0 0 40 40" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M20 9C14 4 7 5 3 7v26c6-2 12-1 17 3 5-4 11-5 17-3V7c-4-2-11-3-17 2Z"/><path d="M20 9v27"/></svg><span>folio</span></div><button class="iconbtn" onclick="showTab('settings')" aria-label="設定"><svg viewBox="0 0 24 24"><path d="M10 2h4l.7 2.4 2.1 1 2.3-1.1 2.7 3-1.4 2.1.5 2.3 2.1 1v4l-2.4.7-1 2.1 1.1 2.3-3 2.7-2.1-1.4-2.3.5-1 2.1h-4l-.7-2.4-2.1-1-2.3 1.1-2.7-3 1.4-2.1-.5-2.3-2.1-1v-4l2.4-.7 1-2.1-1.1-2.3 3-2.7 2.1 1.4 2.3-.5z" transform="translate(1 -1) scale(.92)"/><circle cx="12" cy="12" r="3"/></svg></button></header><div class="searchbar"><div class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input id="search" placeholder="作品名で検索" oninput="render()" aria-label="作品名で検索"></div><button class="filterbtn" onclick="toggleSort()" aria-label="並べ替え">☷</button></div><div class="stats" id="stats"></div><div class="list" id="books"></div></section><section id="add" class="screen"><div class="sectiontitle">作品の追加</div><div class="panel"><div class="field"><label for="newtitle">作品名</label><input id="newtitle" placeholder="例：キングダム"></div><button class="secondary" onclick="searchCovers()">表紙を検索</button><p class="small" id="searchhint">書籍情報サービスから表紙候補を検索します。取得できない場合は画像を自分で登録できます。</p><div class="coverchoices" id="coverchoices"></div><div class="field"><label for="coverurl">表紙画像URL（任意）</label><input id="coverurl" type="url" placeholder="https://..."></div><div class="field"><label for="coverfile">または画像を選択（任意）</label><input id="coverfile" type="file" accept="image/*"></div><div class="row"><div class="field" style="flex:1"><label for="newchapter">現在の話数</label><input id="newchapter" type="number" min="0" value="0"></div><div class="field" style="flex:1"><label for="newstatus">読書状態</label><select id="newstatus"><option value="unread">未読</option><option value="reading" selected>読書中</option><option value="latest">最新話まで</option><option value="done">読了</option></select></div></div><button class="primary" onclick="addBook()">本棚に追加する</button></div></section><section id="records" class="screen"><div class="sectiontitle">読書の記録</div><div class="panel"><div class="small">登録作品</div><div style="font-size:38px;font-weight:700" id="total">0</div><div class="chartbar" id="chartbar"></div><div id="legend" style="margin-top:16px"></div></div><div class="panel"><b>読み終えた作品</b><p class="small">「読了」と「最新話まで」を合わせた作品数です。</p><div id="finishedtotal" style="font-size:32px;font-weight:700">0</div></div><p class="small">読書履歴の推移グラフは、今後の追加候補です。現時点では保存した作品の状態を集計します。</p></section><section id="settings" class="screen"><div class="sectiontitle">設定</div><div class="panel"><b>表示設定</b><div class="settingsrow"><span>並べ替え</span><select id="sortselect" onchange="setSort(this.value)"><option value="initial">登録順</option><option value="title">作品名順</option><option value="chapter">話数の多い順</option><option value="updated">更新した順</option></select></div></div><div class="panel"><b>データ管理</b><div class="settingsrow"><span>バックアップを保存</span><button class="secondary" onclick="exportData()">書き出す</button></div><div class="settingsrow"><span>バックアップを復元</span><button class="secondary" onclick="document.getElementById('importfile').click()">読み込む</button><input id="importfile" type="file" accept="application/json,.json" hidden onchange="importData(event)"></div><div class="settingsrow"><span class="danger">すべてのデータを削除</span><button class="secondary danger" onclick="clearAll()">削除</button></div></div><p class="small">データはこのiPhoneのブラウザ内に保存されます。ブラウザのデータ削除や端末変更に備え、定期的にバックアップしてください。</p></section></div><nav class="bottomnav"><button class="navitem selected" data-tab="home" onclick="showTab('home')"><svg viewBox="0 0 24 24"><path d="M12 5C8 2 4 3 2 4v16c4-1 7 0 10 2 3-2 6-3 10-2V4c-2-1-6-2-10 1Z"/><path d="M12 5v17"/></svg>本棚</button><button class="navitem" data-tab="add" onclick="showTab('add')"><span class="addcircle"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></span>追加</button><button class="navitem" data-tab="records" onclick="showTab('records')"><svg viewBox="0 0 24 24"><path d="M4 21v-8h3v8M11 21V4h3v17M18 21v-12h3v12"/></svg>記録</button><button class="navitem" data-tab="settings" onclick="showTab('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M10 2h4l1 3 3 1 3-1 2 4-2 2v3l2 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 2-2v-3L1 9l2-4 3 1 3-1z"/></svg>設定</button></nav><div id="modalroot"></div><script>
const initial=[['葬送のフリーレン',142],['王様ランキング',243],['ガイシューイッショク',53],['ダーウィン事変',29],['ワールドトリガー',263],['パリピ孔明',74],['ブルーロック',253],['キングダム',891],['ジャンケットバンク',201],['こういうのがいい',48.5],['満州アヘンスクワッド',219],['こうか人間',15],['十字架のろくにん',136],['化物語',5],['転スラ',147],['ルリドラゴン',12],['サンダー',12],['無能なナナ',111],['アカイリンゴ',53],['she is beautiful',24],['バトルスタディーズ',174],['ガチアクタ',6],['薬屋のひとりごと',20],['菌と鉄',41]];
const KEY='folio-books-v1';let books;try{const raw=JSON.parse(localStorage.getItem(KEY));books=Array.isArray(raw)?raw:initial.map((x,i)=>({id:'seed'+i,title:x[0],chapter:x[1],status:'reading',cover:'',updated:0}))}catch(e){books=initial.map((x,i)=>({id:'seed'+i,title:x[0],chapter:x[1],status:'reading',cover:'',updated:0}))}let activeFilter='all',sort=localStorage.getItem('folio-sort')||'initial',selectedCover='',coverResults=[];const labels={done:'読了',latest:'最新話まで',reading:'読書中',unread:'未読'};const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch(e){alert('保存容量が不足しています。画像を減らすかバックアップを利用してください。')}}function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showTab(tab){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===tab));document.querySelectorAll('.navitem').forEach(e=>e.classList.toggle('selected',e.dataset.tab===tab));if(tab==='records')renderRecords();window.scrollTo(0,0)}function setSort(v){sort=v;localStorage.setItem('folio-sort',v);$('sortselect').value=v;render()}function toggleSort(){const vals=['initial','updated','title','chapter'];setSort(vals[(vals.indexOf(sort)+1)%vals.length]);toast('並べ替え：'+$('sortselect').selectedOptions[0].text)}function render(){const counts={done:0,latest:0,reading:0,unread:0};books.forEach(b=>counts[b.status]=(counts[b.status]||0)+1);$('stats').innerHTML=['done','latest','reading','unread'].map(k=>`<button class="stat ${activeFilter===k?'active':''}" onclick="filterStatus('${k}')"><div class="label ${k}">${labels[k]}</div><div class="count ${k}">${counts[k]}</div></button>`).join('');const q=$('search').value.trim().toLocaleLowerCase();let arr=books.filter(b=>(activeFilter==='all'||b.status===activeFilter)&&b.title.toLocaleLowerCase().includes(q));if(sort==='title')arr.sort((a,b)=>a.title.localeCompare(b.title,'ja'));if(sort==='chapter')arr.sort((a,b)=>b.chapter-a.chapter);if(sort==='updated')arr.sort((a,b)=>(b.updated||0)-(a.updated||0));$('books').innerHTML=arr.length?arr.map(b=>`<article class="book">${b.cover?`<img class="cover" src="${safe(b.cover)}" alt="${safe(b.title)}の表紙" onerror="this.outerHTML='<div class=&quot;cover placeholder&quot;>folio</div>'">`:'<div class="cover placeholder">folio</div>'}<div class="bookbody"><div class="booktop"><div class="bookname">${safe(b.title)}</div><button class="more" aria-label="作品を編集" onclick="editBook('${b.id}')">···</button></div><div class="bookbottom"><button class="pill ${b.status}" onclick="changeStatus('${b.id}')">${labels[b.status]||'読書中'}</button><div class="counter"><button class="round" aria-label="1話戻す" onclick="adjust('${b.id}',-1)">−</button><button class="num" aria-label="話数を直接入力" onclick="editChapter('${b.id}')">${safe(b.chapter)}</button><button class="round plus" aria-label="1話進める" onclick="adjust('${b.id}',1)">＋</button></div></div></div></article>`).join(''):'<div class="empty">該当する作品がありません</div>'}function filterStatus(k){activeFilter=activeFilter===k?'all':k;render()}function adjust(id,d){const b=books.find(x=>x.id===id);if(!b)return;b.chapter=Math.max(0,Math.round((Number(b.chapter)+d)*10)/10);if(d>0&&(b.status==='unread'||b.status==='latest'))b.status='reading';b.updated=Date.now();save();render()}function editChapter(id){const b=books.find(x=>x.id===id);if(!b)return;const s=prompt('読んだ話数を入力してください',b.chapter);if(s===null)return;const n=Number(s);if(!Number.isFinite(n)||n<0){alert('0以上の数字を入力してください');return}b.chapter=Math.round(n*10)/10;b.updated=Date.now();save();render()}function modal(html){$('modalroot').innerHTML=`<div class="overlay" onclick="closeModal(event)"><div class="sheet" onclick="event.stopPropagation()">${html}</div></div>`}function closeModal(e){if(!e||e.target.classList.contains('overlay'))$('modalroot').innerHTML=''}function changeStatus(id){const b=books.find(x=>x.id===id);if(!b)return;modal(`<h2>${safe(b.title)}</h2><p class="small">読書状態を選択</p><div class="statusgrid">${['unread','reading','latest','done'].map(k=>`<button class="pill ${k}" onclick="applyStatus('${id}','${k}')">${labels[k]}</button>`).join('')}</div><button class="primary" onclick="closeModal()">閉じる</button>`)}function applyStatus(id,s){const b=books.find(x=>x.id===id);if(b){b.status=s;b.updated=Date.now();save();render()}closeModal()}function editBook(id){const b=books.find(x=>x.id===id);if(!b)return;modal(`<h2>作品を編集</h2><div class="field"><label>作品名</label><input id="edtitle" value="${safe(b.title)}"></div><div class="field"><label>表紙画像URL</label><input id="edcover" value="${safe(b.cover&&b.cover.startsWith('data:')?'':b.cover)}" placeholder="URLを入力（現在の画像は空欄なら維持）"></div><div class="field"><label>画像ファイルから変更</label><input type="file" accept="image/*" id="edfile"></div><button class="primary" onclick="saveEdit('${id}')">変更を保存</button><button class="secondary danger" style="margin-top:14px;width:100%" onclick="deleteBook('${id}')">作品を削除</button>`)}async function saveEdit(id){const b=books.find(x=>x.id===id);if(!b)return;const name=$('edtitle').value.trim();if(!name)return alert('作品名を入力してください');b.title=name;const url=$('edcover').value.trim();if(url)b.cover=url;const f=$('edfile').files[0];if(f){try{b.cover=await imageData(f)}catch(e){alert('画像を読み込めませんでした');return}}b.updated=Date.now();save();closeModal();render()}function deleteBook(id){if(!confirm('この作品を削除しますか？'))return;books=books.filter(b=>b.id!==id);save();closeModal();render()}function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2000)}// Cover lookup: public APIs only; no secret keys or server required.
// Keep reading-data storage (folio-books-v1) untouched.
async function coverFetch(url){
 const c=new AbortController(), timer=setTimeout(()=>c.abort(),10000);
 try{const r=await fetch(url,{signal:c.signal});if(!r.ok){let detail='';try{const j=await r.json();detail=j.error?.message||''}catch(_){}throw Error('HTTP '+r.status+(detail?'：'+detail:''))}return await r.json()}
 finally{clearTimeout(timer)}
}
function coverCacheKey(title){return 'folio-cover-cache-v1:'+title.toLocaleLowerCase()}
function readCoverCache(title){try{const o=JSON.parse(localStorage.getItem(coverCacheKey(title))||'null');return o&&Date.now()-o.time<86400000&&Array.isArray(o.results)?o:null}catch(_){return null}}
function writeCoverCache(title,results,source){try{localStorage.setItem(coverCacheKey(title),JSON.stringify({time:Date.now(),results,source}))}catch(_){}}
async function googleCoverSearch(title){
 const url='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent('intitle:'+title)+'&maxResults=12&printType=books';
 const j=await coverFetch(url);
 return (j.items||[]).map(x=>({title:x.volumeInfo?.title||'',url:(x.volumeInfo?.imageLinks?.thumbnail||x.volumeInfo?.imageLinks?.smallThumbnail||'').replace(/^http:/,'https:')})).filter(x=>x.url)
}
async function openLibraryCoverSearch(title){
 const url='https://openlibrary.org/search.json?title='+encodeURIComponent(title)+'&fields=key,title,cover_i&limit=15&lang=ja';
 const j=await coverFetch(url);
 return (j.docs||[]).filter(x=>Number.isSafeInteger(x.cover_i)&&x.cover_i>0).map(x=>({title:x.title||'',url:'https://covers.openlibrary.org/b/id/'+x.cover_i+'-M.jpg'})).slice(0,12)
}
function displayCoverResults(source){
 $('searchhint').textContent=coverResults.length?'表紙を選択してください（検索先：'+source+'）。別作品・別巻が含まれる場合があります。':'表紙候補が見つかりませんでした。画像URLまたは画像ファイルで登録できます。';
 $('coverchoices').innerHTML=coverResults.map((x,i)=>`<button class="choice" id="choice${i}" onclick="chooseCover(${i})"><img src="${safe(x.url)}" alt="${safe(x.title)}" loading="lazy"><span>${safe(x.title)}</span></button>`).join('')
}
async function searchCovers(){
 const title=$('newtitle').value.trim();if(!title)return alert('作品名を入力してください');
 const btn=document.querySelector('#add button[onclick="searchCovers()"]');
 if(btn.disabled)return;
 btn.disabled=true;$('searchhint').textContent='表紙を検索しています…';$('coverchoices').innerHTML='';selectedCover='';coverResults=[];
 try{
  const cached=readCoverCache(title);
  if(cached){coverResults=cached.results;displayCoverResults(cached.source+'・保存済み');return}
  let googleError='';
  try{coverResults=await googleCoverSearch(title)}catch(e){googleError=e.name==='AbortError'?'タイムアウト':String(e.message||e);console.warn('folio Google Books:',e)}
  if(coverResults.length){writeCoverCache(title,coverResults,'Google Books');displayCoverResults('Google Books');return}
  $('searchhint').textContent='別の書籍データベースでも検索しています…';
  try{
   coverResults=await openLibraryCoverSearch(title);
   if(coverResults.length){writeCoverCache(title,coverResults,'Open Library');displayCoverResults('Open Library');return}
   displayCoverResults('Open Library');
   if(googleError)$('searchhint').textContent+=' Google Booksは利用制限または通信エラーの可能性があります。';
  }catch(e){console.warn('folio Open Library:',e);$('searchhint').textContent='表紙を取得できませんでした。Google Books：'+(googleError||'候補なし')+'／Open Library：'+(e.name==='AbortError'?'タイムアウト':String(e.message||e))+'。画像URLまたは画像ファイルで登録できます。'}
 }finally{btn.disabled=false}
}
function chooseCover(i){selectedCover=coverResults[i].url;document.querySelectorAll('.choice').forEach((e,n)=>e.classList.toggle('selected',i===n))}function imageData(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas');const ratio=Math.min(1,400/img.width,560/img.height);c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.7))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('invalid image'))};img.src=url})}async function addBook(){const title=$('newtitle').value.trim(),chapter=Number($('newchapter').value);if(!title)return alert('作品名を入力してください');if(!Number.isFinite(chapter)||chapter<0)return alert('話数を正しく入力してください');let cover=$('coverurl').value.trim()||selectedCover;const f=$('coverfile').files[0];if(f){try{cover=await imageData(f)}catch(e){return alert('画像を読み込めませんでした')}}books.push({id:'b'+Date.now()+Math.random().toString(36).slice(2),title,chapter:Math.round(chapter*10)/10,status:$('newstatus').value,cover,updated:Date.now()});save();$('newtitle').value='';$('newchapter').value='0';$('coverurl').value='';$('coverfile').value='';$('coverchoices').innerHTML='';$('searchhint').textContent='表紙は任意です。';selectedCover='';activeFilter='all';$('search').value='';render();showTab('home');toast('作品を追加しました')}function renderRecords(){const counts={done:0,latest:0,reading:0,unread:0};books.forEach(b=>counts[b.status]=(counts[b.status]||0)+1);$('total').textContent=books.length;$('finishedtotal').textContent=counts.done+counts.latest;$('chartbar').innerHTML=['done','latest','reading','unread'].map(k=>`<span style="width:${books.length?counts[k]/books.length*100:0}%;background:${{done:'#88b88e',latest:'#f2c46a',reading:'#83afe3',unread:'#aaa39c'}[k]}"></span>`).join('');$('legend').innerHTML=['done','latest','reading','unread'].map(k=>`<div class="settingsrow"><span>${labels[k]}</span><b>${counts[k]} 作品</b></div>`).join('')}function exportData(){const blob=new Blob([JSON.stringify({app:'folio',version:1,exportedAt:new Date().toISOString(),books},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='folio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}async function importData(e){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.books)||!d.books.every(b=>typeof b.title==='string'&&typeof b.id==='string'))throw Error('invalid');if(!confirm('現在の本棚をバックアップの内容で置き換えますか？'))return;books=d.books.map(b=>({id:b.id,title:b.title,chapter:Number(b.chapter)||0,status:labels[b.status]?b.status:'reading',cover:typeof b.cover==='string'?b.cover:'',updated:Number(b.updated)||0}));save();render();renderRecords();toast('復元しました')}catch(err){alert('バックアップファイルを読み込めませんでした')}finally{e.target.value=''}}function clearAll(){if(!confirm('全作品を削除します。元に戻せません。続けますか？'))return;if(!confirm('本当にすべて削除しますか？'))return;books=[];save();render();renderRecords()}$('sortselect').value=sort;render();
</script></body></html>
